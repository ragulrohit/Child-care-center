<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found — STACKLY Child Care Center.">
  <title>Page Not Found — STACKLY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    .err-hero { height: 100vh; min-height: 0; display: grid; place-items: center; padding: 24px 22px; text-align: center; position: relative; overflow: hidden; }
    .err-num {
      font-family: var(--font-display); font-weight: 800; line-height: 1;
      font-size: clamp(6rem, 22vw, 15rem);
      animation: bounce404 2.4s ease-in-out infinite;
    }
    .err-logo {
      width: min(190px, 48vw);
      height: auto;
      margin: 0 auto 8px;
      filter: brightness(0) saturate(100%) invert(24%) sepia(91%) saturate(2441%) hue-rotate(343deg) brightness(91%) contrast(91%);
    }
    .err-num span {
      display: inline-block;
      margin-inline: .04em;
      background: linear-gradient(120deg, #ff6b6b, #e53935, #b71c1c);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .err-num span:nth-child(2) { animation: float 3s ease-in-out infinite; }
    @keyframes bounce404 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  </style>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%235a63e8'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' fill='white' font-family='Arial'%3ES%3C/text%3E%3C/svg%3E">
</head>
<body>
  <main class="err-hero">
    <span class="hero-blob blob-1"></span>
    <span class="hero-blob blob-2"></span>
    <div>
      <a href="index.html" aria-label="STACKLY home"><img class="err-logo" src="../images/Stackly_logo_clean.png" alt="STACKLY"></a>
      <div class="err-num" aria-hidden="true"><span>4</span><span>0</span><span>4</span></div>
      <h1 style="font-size:clamp(1.6rem,3.6vw,2.4rem)">Oops! This Page Is Missing.</h1>
      <p class="lead" style="max-width:520px;margin:14px auto 0">Looks like this little page wandered away. Let's help you find your way back!</p>
      <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:28px">
        <button class="btn btn-soft" id="goBackBtn">Go Back</button>
        <a href="index.html" class="btn">Back to Home</a>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/dropdowns.js"></script>
  <script src="js/forms.js"></script>
  <script>
    document.getElementById("goBackBtn").addEventListener("click", function () {
      if (window.history.length > 1) window.history.back();
      else window.location.href = "index.html";
    });
  </script>
</body>
</html>
